name: Deploy to server

# Deploys the Brand Brain FastAPI service to a Vultr VPS over SSH (password auth).
#
# Flow:  push to main  ->  verify (install + import app.py)  ->  ssh root@IP, cd
#        into the app directory, pull the exact commit, install missing deps,
#        pm2 restart, health-check, roll back automatically if it fails.
#
# Required repository secrets  (Settings -> Secrets and variables -> Actions):
#   SSH_HOST          server IP or hostname
#   SSH_PASSWORD      password for SSH_USER (the Vultr root password)
#   SSH_KNOWN_HOSTS   output of: ssh-keyscan -p 22 <server-ip>   (recommended)
#
# Optional repository variables (same page, "Variables" tab) — defaults shown,
# and the defaults already match the live server:
#   SSH_USER=root   SSH_PORT=22   APP_DIR=/root/Marketing_tool
#   PM2_NAME=marketing-tool   HEALTH_URL=http://127.0.0.1:3001/health
#
# One-time server setup: see deploy/README.md

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'frontend/**'
      - 'frontend-integration.example.jsx'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import the app
        # Catches syntax / import / prompt-file errors before anything touches the
        # server. A dummy key is enough — the Gemini client makes no call on init,
        # and MONGODB_URI is left unset so no DB connection is attempted.
        env:
          GEMINI_API_KEY: ci-import-check-not-a-real-key
        run: python -c "import app; print('OK -', len(app.app.routes), 'routes')"

      - name: Run the offline test suites
        # sales_call and vision_lab only: both are entirely offline. Deepgram is
        # an httpx MockTransport, Gemini a fake client, MongoDB a fake
        # collection, and Vision Lab's ffmpeg / saliency / OCR layer arrives
        # through VisionDeps so a runner needs no ffmpeg binary and no model
        # weights.
        #
        # Not run here, on purpose:
        #   purchase_probability - reads the real PostgreSQL and would fail.
        #   vision_lab_golden    - needs ffmpeg and the ONNX weights (Milestone B).
        env:
          GEMINI_API_KEY: ci-import-check-not-a-real-key
        run: |
          pip install pytest
          python -m pytest tests/ -q -k "sales_call or vision_lab"

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          missing=""
          [ -n "$SSH_HOST" ]     || missing="$missing SSH_HOST"
          [ -n "$SSH_PASSWORD" ] || missing="$missing SSH_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — see deploy/README.md"
            exit 1
          fi

      - name: Install sshpass
        # Not preinstalled on the GitHub runner image.
        run: |
          command -v sshpass >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          }
          sshpass -V | head -1

      - name: Pin the host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::warning::SSH_KNOWN_HOSTS is not set — the root password is sent to whatever host answers, with no way to detect a man-in-the-middle. Set it with: ssh-keyscan -p $SSH_PORT $SSH_HOST"
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
            chmod 644 ~/.ssh/known_hosts
            echo "STRICT=accept-new" >> "$GITHUB_ENV"
            exit 0
          fi

          # Strip CRs and blank lines: a secret pasted from Windows leaves \r on
          # every line, which ssh treats as part of the key and silently ignores.
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # ssh looks up "host" on port 22 and "[host]:port" on any other port.
          if [ "$SSH_PORT" = "22" ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi

          # Which key types are pinned FOR THIS HOST (not just present in the file).
          pinned=$(ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts 2>/dev/null \
                   | awk '!/^#/ && NF {print $2}' | sort -u)
          # ssh-keyscan emits "# host:port SSH-2.0-..." banner lines on stdout in
          # some builds, so skip comments or the host:port lands in the type list.
          offered=$(ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" 2>/dev/null \
                   | awk '!/^#/ && NF {print $2}' | sort -u)

          if [ -n "$pinned" ]; then
            # Matching the host is not enough: a modern client will not negotiate
            # ssh-rsa (SHA-1, disabled by default), so a secret holding only the
            # ssh-rsa line still fails with "No ED25519 host key is known".
            missing=""
            if [ -n "$offered" ]; then
              missing=$(comm -23 <(printf '%s\n' "$offered") <(printf '%s\n' "$pinned"))
            fi

            if printf '%s\n' "$missing" | grep -qx 'ssh-ed25519'; then
              echo "::error::The pinned host key is incomplete — the server offers an ed25519 key but SSH_KNOWN_HOSTS does not contain it, which is what OpenSSH negotiates first."
              echo "Pinned for this host: $(printf '%s ' $pinned)"
              echo "Offered by server:    $(printf '%s ' $offered)"
              echo "Missing:              $(printf '%s ' $missing)"
              echo ""
              echo "ssh-keyscan prints one line per key type. Paste ALL of them into"
              echo "the secret, not just the first."
              exit 1
            fi

            [ -n "$missing" ] && echo "::warning::Not pinned (harmless, the client will not negotiate them): $(printf '%s ' $missing)"
            echo "Pinned host key found. Key types pinned for this host: $(printf '%s ' $pinned)"
            echo "STRICT=yes" >> "$GITHUB_ENV"
            exit 0
          fi

          # No matching entry at all — say exactly why rather than letting ssh fail
          # with a bare "Host key verification failed" and exit 255.
          echo "::error::SSH_KNOWN_HOSTS has no entry matching this host, so strict checking cannot pass."
          echo "Lines in the secret:      $(wc -l < ~/.ssh/known_hosts)"
          echo "Key types in the secret:  $(awk '!/^#/ && NF {print $2}' ~/.ssh/known_hosts | sort -u | tr '\n' ' ')"
          echo "Key types the server offers: $(printf '%s ' $offered)"
          echo ""
          echo "The host names in the secret are compared literally against SSH_HOST."
          echo "Both are masked in this log, so check them yourself — the usual causes are:"
          echo "  1. Only one ssh-keyscan line was pasted. Paste ALL of them."
          echo "  2. The scan used a hostname but SSH_HOST is an IP (or the reverse)."
          echo "     They must be the same string."
          echo "  3. The secret was pasted with Windows line endings (handled above,"
          echo "     so this is no longer it) or with the lines joined into one."
          echo ""
          echo "Fix: run this locally and paste the complete output into SSH_KNOWN_HOSTS,"
          echo "using the exact same host string you put in SSH_HOST:"
          echo "    ssh-keyscan -p $SSH_PORT <the-value-of-SSH_HOST>"
          echo ""
          echo "To unblock right now, delete the SSH_KNOWN_HOSTS secret: the workflow"
          echo "falls back to accept-new and warns instead of failing."
          exit 1

      - name: Deploy and health-check
        env:
          # sshpass -e reads the password from SSHPASS, so it never appears in the
          # process list the way `sshpass -p <password>` would.
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER || 'root' }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          APP_DIR: ${{ vars.APP_DIR || '/root/Marketing_tool' }}
          PM2_NAME: ${{ vars.PM2_NAME || 'marketing-tool' }}
          HEALTH_URL: ${{ vars.HEALTH_URL || 'http://127.0.0.1:3001/health' }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # deploy.sh is piped in from this checkout, so the server always runs the
          # version of the deploy script that ships with the commit being deployed.
          # BatchMode is deliberately NOT set — it disables password authentication.
          sshpass -e ssh -p "$SSH_PORT" \
              -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no \
              -o StrictHostKeyChecking="$STRICT" \
              -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" \
              "APP_DIR='$APP_DIR' PM2_NAME='$PM2_NAME' BRANCH='$BRANCH' DEPLOY_SHA='$GITHUB_SHA' HEALTH_URL='$HEALTH_URL' bash -s" \
              < deploy/deploy.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Target: \`${{ vars.APP_DIR || '/root/Marketing_tool' }}\` (pm2 process \`${{ vars.PM2_NAME || 'marketing-tool' }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
